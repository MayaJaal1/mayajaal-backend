<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>MAYA JAAL · Matrix Stream HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
  
  body {
    background-color: #000;
    color: #00ff88;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    padding-bottom: 95px;
    position: relative;
  }

  /* FULLSCREEN MATRIX CANVAS */
  #matrixCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.42;
    pointer-events: none;
  }

  /* 🌟 TOP HEADER WITH 3D CIRCLE LOGO */
  .header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: rgba(0, 15, 8, 0.92);
    border-bottom: 1px solid rgba(0, 255, 136, 0.35);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 255, 136, 0.15);
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-box img {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #00ff88;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.7);
    animation: logoPulse 3s infinite alternate ease-in-out;
    background: #000;
  }

  @keyframes logoPulse {
    0% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
    100% { box-shadow: 0 0 25px rgba(0, 255, 136, 0.9); }
  }

  .logo-text {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #00ff88;
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
  }

  .logo-text span {
    color: #4fbf8b;
    font-size: 10px;
    display: block;
    letter-spacing: 1.5px;
  }

  .header-open-btn {
    background: linear-gradient(135deg, #00ff88, #00c96a);
    color: #001a0e;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-block;
  }

  /* 🌟 MAIN CONTAINER (CENTERED HUD) */
  .main-content {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 680px;
    margin: 20px auto 0;
    padding: 0 16px;
  }

  .content-meta {
    background: rgba(0, 18, 10, 0.92);
    border: 1px solid rgba(0, 255, 136, 0.4);
    border-radius: 12px 12px 0 0;
    padding: 16px 18px;
    border-bottom: none;
    box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.05);
  }

  .video-title {
    font-size: 16px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.4;
    word-break: break-all;
    margin-bottom: 5px;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
  }

  .video-sub {
    font-size: 11px;
    color: #4fbf8b;
    letter-spacing: 1.2px;
  }

  /* 🌟 MATRIX BLURRED VIDEO PLAYER SCREEN */
  .player-wrapper {
    position: relative;
    width: 100%;
    background: #000;
    border: 1.5px solid rgba(0, 255, 136, 0.5);
    border-radius: 0 0 12px 12px;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(0, 255, 136, 0.2);
  }

  .player-box {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 Aspect Ratio */
    background: #000;
    overflow: hidden;
    cursor: pointer;
  }

  /* ACTUAL VIDEO BACKGROUND BLUR */
  #bgVideo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1.18);
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    filter: blur(14px) brightness(0.55);
    object-fit: cover;
    pointer-events: none;
  }

  /* SCANLINE OVERLAY */
  .scanline {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent, rgba(0, 255, 136, 0.12), transparent);
    animation: scanAnim 2.8s linear infinite;
    pointer-events: none;
    z-index: 4;
  }
  @keyframes scanAnim { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

  /* HUD CORNER BRACKETS */
  .hud-bracket {
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid #00ff88;
    z-index: 5;
    pointer-events: none;
  }
  .hud-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .hud-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .hud-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .hud-br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  /* CENTER LOCKED BUTTON */
  .player-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 6;
    background: radial-gradient(circle, rgba(0, 15, 8, 0.25) 0%, rgba(0, 0, 0, 0.65) 90%);
  }

  .view-in-app-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.9);
    border: 2px solid #00ff88;
    color: #00ff88;
    padding: 13px 26px;
    border-radius: 35px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
    animation: pulseGlow 1.8s infinite alternate;
    text-decoration: none;
  }

  @keyframes pulseGlow {
    from { transform: scale(1); box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
    to { transform: scale(1.05); box-shadow: 0 0 40px rgba(0, 255, 136, 0.9); }
  }

  .free-badge {
    background: #00ff88;
    color: #000;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 900;
  }

  .player-footer-duration {
    position: absolute;
    bottom: 12px;
    left: 16px;
    font-size: 12px;
    color: #00ff88;
    font-weight: bold;
    z-index: 7;
    background: rgba(0, 0, 0, 0.75);
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid rgba(0,255,136,0.4);
    letter-spacing: 1px;
  }

  /* PROMO CARD */
  .promo-card {
    margin-top: 16px;
    padding: 16px 18px;
    background: rgba(0, 18, 10, 0.92);
    border-radius: 12px;
    border: 1px solid rgba(0, 255, 136, 0.35);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .promo-info h3 {
    font-size: 13px;
    color: #ffffff;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .promo-info p {
    font-size: 11px;
    color: #4fbf8b;
    line-height: 1.4;
  }

  .promo-install-btn {
    background: #00ff88;
    color: #000;
    font-weight: 900;
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    letter-spacing: 1.5px;
    border: none;
    cursor: pointer;
    display: inline-block;
  }

  /* FIXED BOTTOM DOCK */
  .bottom-dock {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(0, 10, 5, 0.96);
    border-top: 1px solid rgba(0, 255, 136, 0.4);
    padding: 14px 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 99;
    backdrop-filter: blur(12px);
  }

  .btn-dock {
    flex: 1;
    max-width: 260px;
    padding: 13px 0;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 900;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: inline-block;
  }

  .btn-download {
    background: transparent;
    color: #00ff88;
    border: 1px solid #00ff88;
  }

  .btn-view-app {
    background: #00ff88;
    color: #000;
    border: 1px solid #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  }
</style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <!-- TOP HEADER WITH CIRCULAR LOGO -->
  <div class="header">
    <div class="logo-box">
      <img 
        src="/logo.jpg" 
        alt="Maya Jaal" 
        onerror="this.onerror=null; this.src='https://mayajaal.online/logo.jpg';"
      />
      <div class="logo-text">
        MAYA JAAL
        <span>QUANTUM STREAM NODE</span>
      </div>
    </div>
    <a href="/download" class="header-open-btn">OPEN APP</a>
  </div>

  <div class="main-content">
    <div class="content-meta">
      <div class="video-title" id="displayTitle">Decrypting Media Node...</div>
      <div class="video-sub">Permanent Cloud Storage · Fast Hardware Stream</div>
    </div>

    <div class="player-wrapper">
      <div class="player-box" onclick="goToDownloadPage()">
        <video id="bgVideo" muted loop playsinline preload="auto"></video>
        
        <div class="scanline"></div>
        <div class="hud-bracket hud-tl"></div>
        <div class="hud-bracket hud-tr"></div>
        <div class="hud-bracket hud-bl"></div>
        <div class="hud-bracket hud-br"></div>
        
        <div class="player-overlay">
          <a href="/download" class="view-in-app-btn">
            <span>▶ View in App</span>
            <span class="free-badge">FREE</span>
          </a>
        </div>

        <div class="player-footer-duration" id="durationTxt">00:00 / HD 1080P</div>
      </div>
    </div>

    <div class="promo-card">
      <div class="promo-info">
        <h3>Stream directly in MayaJaal App</h3>
        <p>Ultra HD HUD controls, high-speed playback & ad-free streaming.</p>
      </div>
      <a href="/download" class="promo-install-btn">INSTALL</a>
    </div>
  </div>

  <div class="bottom-dock">
    <a href="/download" class="btn-dock btn-download">⬇ DOWNLOAD APK</a>
    <a href="/download" class="btn-dock btn-view-app">VIEW IN APP</a>
  </div>
    <script>
function goToDownloadPage() {
  if (navigator.vibrate) navigator.vibrate([40]);
  window.location.href = "/download";
}

/* ═══════════════════════════════════════════
   FETCH ACTUAL MEDIA & CALCULATE DURATION
   ═══════════════════════════════════════════ */
const pathParts = window.location.pathname.split('/');
const streamId = pathParts[pathParts.length - 1];

const titleEl = document.getElementById('displayTitle');
const durationEl = document.getElementById('durationTxt');
const bgVideo = document.getElementById('bgVideo');

function formatDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

async function loadMediaDetails() {
  if (!streamId) return;

  try {
    const res = await fetch('/api/v/' + streamId);
    if (res.ok) {
      const data = await res.json();
      if (data.url) {
        bgVideo.src = data.url;
        bgVideo.load();
        bgVideo.play().catch(() => {});
      }
      if (data.name) {
        titleEl.textContent = data.name;
      } else {
        titleEl.textContent = streamId + '.mp4';
      }
    } else {
      titleEl.textContent = streamId + '.mp4';
    }
  } catch (e) {
    titleEl.textContent = streamId + '.mp4';
  }
}

bgVideo.addEventListener('loadedmetadata', function() {
  if (bgVideo.duration && !isNaN(bgVideo.duration) && bgVideo.duration > 0) {
    durationEl.textContent = formatDuration(bgVideo.duration) + ' / HD 1080P';
  }
});

bgVideo.addEventListener('durationchange', function() {
  if (bgVideo.duration && !isNaN(bgVideo.duration) && bgVideo.duration > 0) {
    durationEl.textContent = formatDuration(bgVideo.duration) + ' / HD 1080P';
  }
});

loadMediaDetails();

/* ═══════════════════════════════════════════
   MATRIX RAIN ENGINE
   ═══════════════════════════════════════════ */
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let cols, drops;
const chars = '0123456789ABCDEFアイウエオカキクケコサシスセソタチツテト'.split('');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / 15);
  drops = new Array(cols).fill(1);
}
resize();
window.addEventListener('resize', resize);

function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = '13px monospace';
  
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 15;
    const y = drops[i] * 15;
    ctx.fillStyle = '#ccffe5';
    ctx.fillText(text, x, y);
    ctx.fillStyle = '#00ff88';
    ctx.fillText(text, x, y - 15);
    if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 40);
</script>
</body>
</html>
